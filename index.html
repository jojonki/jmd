<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' jmd-file: data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' ws://localhost:5173 http://localhost:5173"
    />
    <title>jmd</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <button id="doc-path" class="doc-path" type="button" hidden>
          <svg class="doc-path-icon" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
            <path d="M1.6 12.4V3.6h4.1l1.3 1.6h7.4v7.2a1 1 0 0 1-1 1H2.6a1 1 0 0 1-1-1Z"
              fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <span id="doc-path-text" class="doc-path-text"></span>
        </button>
        <div class="tb-drag"></div>
        <div class="tb-controls">
          <button id="btn-settings" class="tb-btn tb-icon" type="button" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </header>

      <nav id="tabbar" class="tabbar" aria-label="Open documents">
        <div id="tabs" class="tabs" role="tablist"></div>
        <button id="tab-new" class="tab-new" type="button" title="New tab" aria-label="New tab">+</button>
      </nav>

      <main id="panes" class="layout-split">
        <section id="editor-pane" class="pane"></section>
        <div id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <section id="preview-pane" class="pane">
          <div id="find" class="find-bar" hidden>
            <div class="find-box">
              <input id="find-input" class="find-input" type="text" spellcheck="false"
                placeholder="Find in preview" aria-label="Find in preview" />
              <span id="find-count" class="find-count" aria-live="polite"></span>
              <button id="find-prev" class="find-btn" type="button" title="Previous match" aria-label="Previous match">↑</button>
              <button id="find-next" class="find-btn" type="button" title="Next match" aria-label="Next match">↓</button>
              <button id="find-close" class="find-btn" type="button" title="Close" aria-label="Close find">×</button>
            </div>
          </div>
          <article id="preview" class="markdown-body"></article>
        </section>
      </main>

      <footer id="statusbar">
        <span id="status-layout" aria-live="polite">Split</span>
        <span class="sb-sep"></span>
        <span id="status-mode" aria-live="polite">Preview editing</span>
        <span class="sb-sep"></span>
        <span id="status-counts"></span>
        <span class="sb-grow"></span>
        <span id="status-msg"></span>
      </footer>
    </div>

    <div id="settings" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="dialog-head">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-close" class="icon-btn" type="button" aria-label="Close settings">×</button>
        </header>
        <nav class="dialog-nav">
          <button class="nav-btn is-active" type="button" data-section="appearance">Appearance</button>
          <button class="nav-btn" type="button" data-section="shortcuts">Shortcuts</button>
        </nav>
        <div class="dialog-body">
          <section id="pane-appearance" class="settings-pane"></section>
          <section id="pane-shortcuts" class="settings-pane" hidden></section>
        </div>
      </div>
    </div>

    <div id="about" class="overlay" hidden>
      <div class="dialog dialog-narrow" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <header class="dialog-head">
          <h2 id="about-title">About jmd</h2>
          <button id="about-close" class="icon-btn" type="button" aria-label="Close about">×</button>
        </header>
        <div class="dialog-body" id="about-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
